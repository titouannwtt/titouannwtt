  <desc id="d">A terminal window. whoami: Titouann Wtt, software engineer, founder of Jam Jam. Focus: AI tooling, Python backends, trading systems, music apps. Shipping: jam-jam, freqtrade-ultimate, frequi-ultimate, claude-tools. Status: open to opportunities, linkedin.com/in/titouann-wtt.</desc>
